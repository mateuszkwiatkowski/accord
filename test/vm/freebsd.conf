IMAGE_SHA_aarch64=sha256:6784c274f8f20eb4687de5e79283d5a3486a07278fce4d58d0d01d198d2c45ed
IMAGE_URL_x86_64=https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-ufs.raw.xz
IMAGE_SHA_x86_64=sha256:926733d965078b5d635931eccc34022f74f803d35b79c05ccc2ec8a7f0ebcca2
# nuageinit (FreeBSD's cloud-init) has no default user: create it in the seed.
# root has an empty password and LOGIN is in wheel, so su needs no prompt.
LOGIN=freebsd
BECOME=su
SEED=users
# Zig target without the architecture
TARGET=freebsd
SSH_PORT=2304
EXPECT_DETECT="os_family=freebsd pkg_manager=pkg init_system=rc user_tool=pw"
SERVICE=cron
