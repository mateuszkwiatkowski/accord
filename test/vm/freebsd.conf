# FreeBSD 15.1 (FreeBSD libc, pkg, rc.d)
NAME="FreeBSD 15.1"
IMAGE_URL=https://download.freebsd.org/releases/VM-IMAGES/15.1-RELEASE/aarch64/Latest/FreeBSD-15.1-RELEASE-arm64-aarch64-BASIC-CLOUDINIT-ufs.raw.xz
IMAGE_SHA=sha256:6784c274f8f20eb4687de5e79283d5a3486a07278fce4d58d0d01d198d2c45ed
# nuageinit (FreeBSD's cloud-init) has no default user: create it in the seed.
# root has an empty password and LOGIN is in wheel, so su needs no prompt.
LOGIN=freebsd
BECOME=su
SEED=users
TARGET=aarch64-freebsd
SSH_PORT=2304
EXPECT_DETECT="os_family=freebsd pkg_manager=pkg init_system=rc user_tool=pw"
SERVICE=cron
