IMAGE_SHA_aarch64=sha512:3942cc527cb142f1cd8f5382b6411e9fe5e8f06b8f33cc2800faef9dff658fbdec4f0ac395a4eae02e8e1706f9dd71224ebbee8d5c5f763773d39e75a1321d81
IMAGE_URL_x86_64=https://cloud.debian.org/images/cloud/trixie/20261123-2671/debian-13-genericcloud-amd64-20261123-2671.qcow2
IMAGE_SHA_x86_64=sha512:76488ba3bea2349cc595fedad7748b8ba98d6b36da398eaf2bbbae3db896ba1017d4ff41cd277926784cef2c1c11145a0d600f9b4afde9b8f174d698db0cda03
LOGIN=debian
BECOME=sudo
SEED=default
# Zig target without the architecture
TARGET=linux-musl
SSH_PORT=2306
